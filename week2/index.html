<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content-Based Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Content-Based Movie Recommender</h1>
        <p>Select one movie you like, or build a profile from exactly three distinct movies.</p>
        
        <div class="controls">
            <label for="recommendation-mode">Recommendation mode</label>
            <select id="recommendation-mode" disabled>
                <option value="single">One movie</option>
                <option value="profile">Three-movie profile</option>
            </select>
            <label for="movie-select">Movie 1</label>
            <select id="movie-select" disabled>
                <option value="" disabled selected>Select a movie</option>
            </select>
            <div id="movie-select-2-group" class="movie-field" hidden>
                <label for="movie-select-2">Movie 2</label>
                <select id="movie-select-2" disabled>
                    <option value="" disabled selected>Select a movie</option>
                </select>
            </div>
            <div id="movie-select-3-group" class="movie-field" hidden>
                <label for="movie-select-3">Movie 3</label>
                <select id="movie-select-3" disabled>
                    <option value="" disabled selected>Select a movie</option>
                </select>
            </div>
            <button id="recommend-btn" onclick="getRecommendations()" disabled>Get Recommendations</button>
        </div>
        
        <div id="result-box" aria-live="polite">
            <p id="result" class="loading">Please wait, loading data...</p>
            <ol id="recommendations"></ol>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
